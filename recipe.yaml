schema_version: 1

context:
  name: "geoapps-utils"
  version: "0.7.0a2.dev15+0c87794"  # This will be replaced by the actual version in the build process
  python_min: "3.12"
  module_name: ${{ name|lower|replace("-", "_") }}

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  path: ../${{ name }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.12.*
    - poetry-core >=1.8.0
    - poetry-dynamic-versioning >=1.9, 1.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    # Mira packages
    - geoh5py >=0.13.0a, 0.13.*
    # direct dependencies
    - numpy 2.0*
    - pydantic >=2.12.0, 2.*
    - scipy 1.17.*
    - matplotlib-base >=3.10.0, 3.10.*

tests:
  - python:
      imports:
        - ${{ module_name }}
        - ${{ module_name }}._version
  - script:
      - pytest --ignore=tests/version_test.py
    requirements:
      run:
        - pytest
    files:
      source:
        - tests/
  - package_contents:
      files:
        - site-packages/${{ module_name }}/_version.py

about:
  summary: Utility functions to build applications supported by Mira Geoscience.
  description: |
    The geoapps-utils package provides utility functions
    used by Python applications supported by [Mira Geoscience](https://www.mirageoscience.com/mining-industry-software/geoscience-analyst/python-integration/).
  license: MIT
  license_file:
    - LICENSE
    - THIRD_PARTY_SOFTWARE.rst
  homepage: https://www.mirageoscience.com/mining-industry-software/python-integration/
  repository: https://github.com/MiraGeoscience/geoapps-utils

extra:
  recipe-maintainers:
    - andrewg-mira
    - sebhmg

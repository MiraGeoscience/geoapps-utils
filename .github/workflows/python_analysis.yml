name: Python analysis

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - main
      - release/**
      - feature/**
      - hotfix/**
  push:
    branches:
      - develop
      - main
      - release/**
      - feature/**
      - hotfix/**

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-workflow-static-analysis:
    name: Static analysis
    uses: MiraGeoscience/CI-tools/.github/workflows/reusable-python-static_analysis.yml@20da2e032e4878ec1c6cdb4cf52d02a8cee24ae6 # GA-9681
    permissions:
      contents: read
      pull-requests: read
    with:
      package-manager: 'pixi'
      app-name: 'geoapps_utils'
      python-version: '3.12'
      pixi-version: 'v0.67.2'
  call-workflow-pytest:
    name: Pytest
    uses: MiraGeoscience/CI-tools/.github/workflows/reusable-python-pytest.yml@20da2e032e4878ec1c6cdb4cf52d02a8cee24ae6 # GA-9681
    permissions:
      contents: read
      pull-requests: read
    with:
      package-manager: 'pixi'
      python-versions: '["3.12", "3.13", "3.14"]'
      pixi-version: 'v0.67.2'
      pixi-setup-task: 'install'
      os: '["ubuntu-latest", "windows-latest"]'
      codecov-reference-python-version: '3.12'
      codecov-reference-os: '["windows-latest"]'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
